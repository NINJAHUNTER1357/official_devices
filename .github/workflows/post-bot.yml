name: ASCP Poster Bot

on:
  push:
    paths:
      - "API/updater/*.json"
  workflow_dispatch:

env:
  GitHubMail: "ascpbot128@gmail.com"
  GitHubName: "TheASCPBot"
  GitHubToken: ${{ secrets.GH_TOKEN }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  PRIV_CHAT_ID: ${{ secrets.PRIV_CHAT_ID }}

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt remove python3-yaml
          sudo pip install pyTelegramBotAPI noobstuffs PyGithub pillow

      - name: Set Git Configs & Secrets
        run: |
          git config --global user.email ${GitHubMail}
          git config --global user.name ${GitHubName}
          git config --global color.ui true
          git config --global credential.helper store
          echo "https://${GitHubName}:${GitHubToken}@github.com" > ~/.git-credentials

      - name: Run ASCPPosterBot
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: sudo -E python3 .github/scripts/post.py

      - name: Commit and Push Changes
        run: | 
          git fetch && git pull
          if [ -f commit_mesg.txt ]; then
            COMMIT_MESSAGE=$(cat commit_mesg.txt)
            rm commit_mesg.txt
            git add . && git commit -sm "$COMMIT_MESSAGE"
            git push origin ${{ github.ref_name }}
          else
            echo "Nothing to commit"
          fi
